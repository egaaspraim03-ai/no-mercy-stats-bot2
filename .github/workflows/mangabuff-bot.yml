name: MangaBuff Stats Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "day | week | month | all | recent"
        required: true
        default: "day"
        type: choice
        options:
          - day
          - week
          - month
          - all
          - recent
  schedule:
    # Каждый день 20:50 UTC ≈ 23:50 МСК (топ дня)
    - cron: "50 20 * * *"
    # Воскресенье 20:50 UTC ≈ 23:50 МСК (топ недели)
    - cron: "50 20 * * 0"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FULL_COOKIE: ${{ secrets.FULL_COOKIE }}
          CLUB_SLUG: ${{ secrets.CLUB_SLUG }}
          PROXY: ${{ secrets.PROXY }}
          RUN_KEY: ${{ secrets.RUN_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            # schedule: Sunday week, else day
            DOW=$(date -u +%u)
            if [ "$DOW" = "7" ]; then MODE=week; else MODE=day; fi
          fi
          echo "MODE=$MODE"
          python bot.py "$MODE"
